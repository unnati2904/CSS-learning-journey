<!DOCTYPE html>
<html>
    <head>
        <title>Newton Cradle</title>
    </head>
    <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                 width: 100%;
                 height: 100vh;
                 background-color: black;
            }
            .cradle{
                width: 400px;
                height: 4px;
                background-color:transparent;
                border-top: 2rem solid blue;
                justify-content: center;
                gap: 20px;
                position: absolute;
                top:20%;
                left:50%;
                right: 10%;
                transform: translate(-50% , -50%);
                display: flex;
                gap:20px
            }
            div{
                width:3.5px;
                height: 80px;
                background-color: blue;
                position: relative;
            }
            .cradle div::before{
                content: "";
                position: absolute;
                left: -10px;
                top: 90%;
                width: 25px;
                aspect-ratio: 1;
                border-radius: 50%;
                background-color: blue;
            }
            .cradle div:first-child{
                animation-name: leftSwing;
                animation-duration: 2s;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                transform-origin: top left;
            }
            .cradle div:last-child{
                animation-name: rightSwing;
                animation-duration: 2s;
                animation-timing-function: linear;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                transform-origin: top left;
            }
            
            @keyframes leftSwing{
                0%{
                    rotate: 0deg;
                }
                25%{
                    rotate:30deg;
                }
                50%{
                    rotate:0deg;
                }
                100%{
                    rotate:0deg;
                } 
            }
            @keyframes rightSwing{
                0%{
                    rotate: 0deg;
                }
                25%{
                    rotate:-30deg;
                }
                50%{
                    rotate:0deg;
                }
                100%{
                    rotate:0deg;
                } 
            }
            
            </style>
    <body>
        <div class="cradle">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </body>
</html>
