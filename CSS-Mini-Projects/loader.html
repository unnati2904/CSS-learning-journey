<!DOCTYPE html>
<html>
    <head>
        <title>Loader</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                width: 100%;
                height: 100vh;
                background-color: black;
                display: grid;
                place-items: center;
            }
            .loader{
                width: 20rem;
                aspect-ratio: 1;
                background-color:#865dff;
                border-radius: 50%;
                position: relative;
                animation: circleLoader 1.7s linear infinite reverse;
                }
                @keyframes circleLoader{
                    100%{
                        rotate: 360deg;
                    }
                }
             .loader::before{
              content: "";
              position: absolute;
              top: 0;
              left: 0;
              width:17rem ;
              aspect-ratio: 1;
              border-radius: 50%;
              background-color: black;
             } 
             .loader::after{
              content: "";
              position: absolute;
              top: 0;
              left: 0;
              width:5rem ;
              aspect-ratio: 1;
              border-radius: 50%;
              background-color: #865dff;
              box-shadow: 0 0 1rem #865dff, 0 0 1.5rem #865dff, 0 0 2rem #865dff,
          0 0 2.5rem #865dff, 0 0 3rem #865dff;
          left: 40%;
          top: -10%;
             } 
        </style>
    </head>
    <body>
        <div class="loader"></div>
    </body>
</html>
